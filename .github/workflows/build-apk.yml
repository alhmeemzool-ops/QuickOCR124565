name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Download OCR models
        working-directory: app/src/main/assets/tessdata
        run: |
          rm -f PUT_ARA_TRAINEDDATA_HERE.txt
          curl -L --fail --retry 3 -o ara.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata
          curl -L --fail --retry 3 -o eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickOCR-debug
          path: app/build/outputs/apk/debug/app-debug.apk
